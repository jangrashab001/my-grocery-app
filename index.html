<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166534"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>My Grocery List</title><style>body{margin:0;background:#f3f7f2;font:16px system-ui;color:#183322}header{background:#166534;color:white;padding:22px 16px}main{max-width:680px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #1232}h1{margin:0;font-size:25px}h2{font-size:18px;margin:0 0 12px}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #ccc}button{background:#166534;color:white;border:0;cursor:pointer}button.alt{background:#e8f1e8;color:#166534}button.danger{background:#fbeaea;color:#9d2525}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item input{width:22px;height:22px;accent-color:#166534}.item label{flex:1}.done{text-decoration:line-through;color:#888}.del{padding:5px 10px}#bar{background:#e3e9e3;height:10px;border-radius:20px;overflow:hidden}#fill{background:#16a34a;height:100%;width:0}.muted{color:#667}.field{width:100%;box-sizing:border-box;margin:5px 0}.hide{display:none}</style></head><body><header><main style="padding:0"><h1>🛒 My Grocery List</h1><div>Free · Offline · No ads</div></main></header><main><section class="card"><strong id="count">0 purchased</strong><div id="bar" style="margin:12px 0"><div id="fill"></div></div><div class="actions"><button id="install" class="hide">Install app</button><button class="alt" id="hide">Hide purchased</button><button class="alt" id="reset">Uncheck all</button></div></section><section class="card"><h2>Add item</h2><input id="name" class="field" placeholder="Item name"><select id="category" class="field"></select><button id="add">Add item</button></section><div id="list"></div><section class="card"><h2>Keep your data safe</h2><p class="muted">Checks save automatically on this device. Export a backup before clearing browser data or switching phones.</p><div class="actions"><button id="backup">Backup list</button><button id="restore" class="alt">Restore backup</button><input type="file" accept=".json,application/json" id="file" hidden></div></section></main><script>
const initial={"Cleaning & Household":["Surf Excel (Detergent)","Harpic Red (Toilet Cleaner)","Washing Powder"],"Personal Care":["Cinthol Soap","Toothpaste","Body Lotion"],"Ghee & Dairy":["Ghee — 3 kg","Dalda Ghee"],"Pulses & Legumes":["Chole (Chickpeas)","Rajma (Kidney Beans)"],"Spices & Seasonings":["Chole Masala","Salt (Namak)","Turmeric (Haldi)","Red Chilli Powder (Mirch)","Garam Masala","Cumin Seeds (Jeera) — 250 g","Kasuri Methi","Methi Dana (Fenugreek Seeds)"],"Sugar & Sweeteners":["Bura (Powdered Sugar)","Sugar (Chini) — 5 kg"],"Snacks & Packaged Foods":["Pasta","Macaroni","Namkeen","Biscuits","Raita Boondi"],"Other Grocery Items":["Refined Oil","Tea Leaves (Chai Patti)","Dhaniya Sukha (Dried Coriander)"]};
const key="my-grocery-app-v2";let items;try{items=JSON.parse(localStorage.getItem(key));if(!Array.isArray(items))throw Error()}catch(e){items=Object.entries(initial).flatMap(([category,names])=>names.map(name=>({id:crypto.randomUUID(),name,category,done:false})))}let hidden=false;
function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){alert("Storage unavailable. Please use Backup list.")}}
const list=document.getElementById("list"),cat=document.getElementById("category");
function render(){const categories=[...new Set([...Object.keys(initial),...items.map(x=>x.category)])];cat.replaceChildren(...categories.map(c=>{const o=document.createElement("option");o.textContent=c;o.value=c;return o}));const bought=items.filter(x=>x.done).length;document.getElementById("count").textContent=bought+" of "+items.length+" purchased";document.getElementById("fill").style.width=(items.length?100*bought/items.length:0)+"%";list.replaceChildren();for(const c of categories){const entries=items.filter(x=>x.category===c&&(!hidden||!x.done));if(!entries.length)continue;const section=document.createElement("section");section.className="card";const title=document.createElement("h2");title.textContent=c+" ("+entries.length+")";section.append(title);for(const x of entries){const row=document.createElement("div");row.className="item";const check=document.createElement("input");check.type="checkbox";check.checked=!!x.done;check.addEventListener("change",()=>{x.done=check.checked;save();render()});const label=document.createElement("label");label.textContent=x.name;if(x.done)label.className="done";label.addEventListener("click",()=>{x.done=!x.done;save();render()});const del=document.createElement("button");del.textContent="×";del.className="danger del";del.setAttribute("aria-label","Delete "+x.name);del.onclick=()=>{if(confirm("Delete "+x.name+"?")){items=items.filter(y=>y.id!==x.id);save();render()}};row.append(check,label,del);section.append(row)}list.append(section)}document.getElementById("hide").textContent=hidden?"Show purchased":"Hide purchased"}
document.getElementById("add").onclick=()=>{const n=document.getElementById("name");if(!n.value.trim())return;items.push({id:crypto.randomUUID(),name:n.value.trim(),category:cat.value,done:false});n.value="";save();render()};document.getElementById("hide").onclick=()=>{hidden=!hidden;render()};document.getElementById("reset").onclick=()=>{if(confirm("Uncheck every item?")){items.forEach(x=>x.done=false);save();render()}};
document.getElementById("backup").onclick=()=>{const blob=new Blob([JSON.stringify({version:2,items},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="grocery-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};document.getElementById("restore").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.items)||!obj.items.every(x=>typeof x.name==="string"&&typeof x.category==="string"))throw Error();if(confirm("Replace your list with this backup?")){items=obj.items.map(x=>({id:x.id||crypto.randomUUID(),name:x.name,category:x.category,done:!!x.done}));save();render()}}catch(e){alert("Invalid backup file")}e.target.value=""};
let installPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;document.getElementById("install").classList.remove("hide")});document.getElementById("install").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("install").classList.add("hide")}};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");render();
</script></body></html>
